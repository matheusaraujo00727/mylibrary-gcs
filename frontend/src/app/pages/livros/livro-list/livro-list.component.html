<div style="margin-bottom: 20px;">

  <input
    placeholder="Buscar por título ou autor"
    [(ngModel)]="filtros.busca"
  />

  <select [(ngModel)]="filtros.status">
    <option value="">Todos</option>
    <option value="DISPONIVEL">Disponível</option>
    <option value="EMPRESTADO">Emprestado</option>
  </select>

  <select [(ngModel)]="filtros.categoriaId">
    <option value="">Todas categorias</option>
    <option *ngFor="let cat of categorias" [value]="cat.id">
      {{ cat.nome }}
    </option>
  </select>

  <button (click)="aplicarFiltro()">Filtrar</button>
  <button (click)="limpar()">Limpar</button>

  <button (click)="novoLivro()">Novo Livro</button>

  <tr *ngFor="let livro of livros">
    <td>{{ livro.titulo }}</td>
    <td>{{ livro.autor }}</td>
    <td>{{ getCategoriaNome(livro.categoriaId) }}</td>
    <td>{{ livro.status }}</td>

    <td>
      <button (click)="deletar(livro)" [disabled]="livro.status === 'EMPRESTADO'">
        Excluir
      </button>
    </td>
  </tr>

</div>

<hr />

<table border="1" width="100%">
  <tr>
    <th>Título</th>
    <th>Autor</th>
    <th>Status</th>
    <th>Categoria</th>
  </tr>

  <tr *ngFor="let livro of livros">
    <td>{{ livro.titulo }}</td>
    <td>{{ livro.autor }}</td>
    <td>{{ livro.status }}</td>
    <td>{{ getCategoriaNome(livro.categoriaId) }}</td>
  </tr>
</table>
